    <script>
      /* Show the logo overlay before the first paint, only on the first
         page of a visit. Keep in sync with js/loader.js. */
      (function () {
        try {
          var html = document.documentElement;
          html.classList.add("js");
          var q = location.search;
          if (/(?:\?|&)loader=0(?:&|$)/.test(q)) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          var freeze = /(?:\?|&)freeze=([0-9]*\.?[0-9]+)(?:&|$)/.exec(q);
          if (freeze) {
            html.classList.add("is-loading");
            html.setAttribute("data-freeze", freeze[1]);
            html.style.setProperty("--freeze", "-" + freeze[1] + "s");
            return;
          }
          var force = /(?:\?|&)loader=1(?:&|$)/.test(q);
          if (!force && sessionStorage.getItem("magu-loader") === "1") return;
          html.classList.add("is-loading");
        } catch (e) {}
      })();
    </script>
    <script src="js/loader.js" defer></script>
